<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Micro AI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🤖 My Micro AI</h1>

        <p class="subtitle">
            Ask me a question
        </p>

        <div class="search-box">

            <input
                type="text"
                id="questionInput"
                placeholder="Type your question..."
            >

            <button id="askButton">
                Ask
            </button>

        </div>

        <div id="result">

            <p>
                Your answer will appear here.
            </p>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
